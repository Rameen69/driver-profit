<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<script src="config.js"></script><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="กำไรคนขับ"><meta name="theme-color" content="#f26a1b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driver Profit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f1;--card:#fff;--ink:#3d3441;--mut:#9b8fa0;--line:#f0e6df;--acc:#ff8f6b;--accf:#fff;--ok:#2f9e7e;--warn:#c98a1b;--bad:#d9566b;--okb:#e0f5ee;--warnb:#fdf1d8;--badb:#fde4e8;--h1:#ffe3d3;--h2:#ffd1e1;--sh:0 6px 20px rgba(120,80,90,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a24;--card:#2a2531;--ink:#f4eef7;--mut:#a99eb4;--line:#3b3444;--acc:#ff9d7a;--accf:#2b1a14;--ok:#6fd3b3;--warn:#efc062;--bad:#ff8fa1;--okb:#1d3a33;--warnb:#3d3319;--badb:#44222b;--h1:#3a2f4a;--h2:#4a2f3d;--sh:0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#1e1a24;--card:#2a2531;--ink:#f4eef7;--mut:#a99eb4;--line:#3b3444;--acc:#ff9d7a;--accf:#2b1a14;--ok:#6fd3b3;--warn:#efc062;--bad:#ff8fa1;--okb:#1d3a33;--warnb:#3d3319;--badb:#44222b;--h1:#3a2f4a;--h2:#4a2f3d;--sh:0 6px 20px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(700px 380px at 95% -5%,var(--h2),transparent 65%),radial-gradient(600px 360px at -10% 8%,var(--h1),transparent 65%);background-attachment:fixed;color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:16px}
main{max-width:640px;margin:0 auto;padding:18px 14px 120px}
h1{font-size:23px;margin:6px 0 14px;font-weight:800}h2{font-size:14px;margin:20px 0 8px;color:var(--mut);font-weight:600;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:var(--ink);border:0;border-radius:26px;padding:20px}
.hero .big{font-size:42px;font-weight:800;line-height:1.15}.hero small{opacity:.75}
.seg{display:flex;gap:8px}.seg button,.chip{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:11px 6px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg .on{border-color:var(--acc);background:var(--acc);color:var(--accf)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:20px;margin-top:2px}.stat span{font-size:13px;color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.warn{color:var(--warn)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.row .l{color:var(--mut)}.row.t{font-weight:800}
.item{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;border-bottom:1px dashed var(--line)}.item:last-child{border:0}.item small{color:var(--mut);display:block;margin-top:2px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 30px rgba(90,60,80,.16);display:flex;justify-content:space-around;align-items:center;padding:6px 4px;z-index:5}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:6px 8px;cursor:pointer;flex:1}nav button.on{color:var(--acc);font-weight:800}
nav .plus{background:var(--acc);color:var(--accf);border-radius:50%;width:54px;height:54px;flex:none;font-size:30px;margin-top:-30px;box-shadow:0 8px 18px rgba(255,143,107,.45)}
.fab{width:100%;background:var(--acc);color:var(--accf);border:0;border-radius:20px;padding:17px;font:inherit;font-size:19px;font-weight:800;margin:14px 0;cursor:pointer;box-shadow:0 8px 18px rgba(255,143,107,.35)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:0;border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#sheet{position:fixed;inset:0;background-color:var(--bg);background-image:radial-gradient(700px 380px at 95% -5%,var(--h2),transparent 65%);z-index:10;overflow:auto;display:none;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 40px}
#sheet>div{max-width:640px;margin:0 auto}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:700;font-size:14px}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}
.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:16px;padding:12px;font:inherit;width:100%;cursor:pointer}
.danger{color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:right;border-bottom:1px dashed var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:26px}
</style></head><body>
<main id="app"></main><div id="sheet"><div id="sheetc"></div></div>
<div id="sync" onclick="syncClick()" style="cursor:pointer;padding:4px 8px;position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:12px;z-index:4;font-size:12px;color:var(--mut)"></div><nav id="nav"></nav>
<script>
(()=>{try{const t=localStorage.getItem('lm_theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}})();
/* ===== Calculation Engine (pure, testable) ===== */
const Calc={
 commission:(g,r)=>g*r/100,
 netIncome:(g,r)=>g-g*r/100,
 fuelPerKm:(price,kmpl)=>kmpl>0?price/kmpl:0,
 depPerKm:(value,life)=>life>0?value/life:0,
 fuelCost:(km,fpk)=>km*fpk,
 hours:o=>{const[a,b]=[o.start,o.end].map(t=>{if(!t)return null;const[h,m]=t.split(':');return h*60+ +m});return a==null||b==null||b<a?0:(b-a)/60},
 order(o,s){const c=this.commission(o.gross,o.rate),net=o.gross-c,fuel=this.fuelCost(o.km,s.fuelPerKm),extra=(+o.toll||0)+(+o.parking||0)+(+o.other||0),dep=s.useDep?o.km*s.depPerKm:0,cash=net-fuel-extra,tr=cash-dep;return{comm:c,net,fuel,extra,dep,cash,true:tr,hrs:this.hours(o)}},
 sum(orders,exps,s){const r={n:orders.length,gross:0,comm:0,net:0,fuel:0,extra:0,dep:0,km:0,hrs:0,exp:0};
  orders.forEach(o=>{const c=this.order(o,s);r.gross+=o.gross;r.comm+=c.comm;r.net+=c.net;r.fuel+=c.fuel;r.extra+=c.extra;r.dep+=c.dep;r.km+=o.km;r.hrs+=c.hrs});
  exps.filter(e=>e.count).forEach(e=>r.exp+=e.amount);
  r.cash=r.net-r.fuel-r.extra-r.exp;r.true=r.cash-r.dep;
  r.cost=r.fuel+r.extra+r.exp;
  const d=(a,b)=>b>0?a/b:0;r.netHr=d(r.net,r.hrs);r.cashHr=d(r.cash,r.hrs);r.trueHr=d(r.true,r.hrs);r.netKm=d(r.net,r.km);r.cashKm=d(r.cash,r.km);r.trueKm=d(r.true,r.km);return r},
 fuelStats(l){const a=[...l].sort((x,y)=>x.odo-y.odo),legs=a.slice(1).map((e,i)=>({...e,km:e.odo-a[i].odo,kmpl:e.liters>0?(e.odo-a[i].odo)/e.liters:0,bkm:e.odo>a[i].odo?e.total/(e.odo-a[i].odo):0})),sum=(x,k)=>x.reduce((t,e)=>t+e[k],0),L=sum(legs,'liters'),K=sum(legs,'km'),T=sum(legs,'total'),sl=sum(a,'liters');return{legs,kmpl:L?K/L:0,bkm:K?T/K:0,avgPrice:sl?sum(a,'total')/sl:0}},
 verdict(p,s){return p>=s.thG?'ok':p>=s.thY?'warn':'bad'}
};
/* ===== Data layer ===== */
const KEY='lalamove_profit_v1';
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){
 let seedN=7;const rnd=()=>(seedN=(seedN*9301+49297)%233280)/233280;
 const types=['ประหยัด','ปกติ','เร่งด่วน'],rates=[25,25,17,17,7],areas=['ลาดพร้าว','สุขุมวิท','บางนา','รัชดา','ปทุมวัน','จตุจักร'],o=[];
 for(let d=0;d<14;d++){const day=addDays(ymd(new Date()),-d),n=d===0?3:2+Math.floor(rnd()*3);let t=8*60+Math.floor(rnd()*60);
  for(let i=0;i<n;i++){const ty=Math.floor(rnd()*3),km=Math.round(6+rnd()*28),g=Math.round((60+km*(7+ty*2.5)+rnd()*60)/5)*5,dp=Math.round(2+rnd()*8),dr=Math.round(rnd()*10),dur=Math.round((km+dp+dr)*2.4+18),a=areas[Math.floor(rnd()*6)];
   const f=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
   o.push({id:uid(),date:day,start:f(t),end:f(t+dur),oid:'LM'+Math.floor(1000+rnd()*8999),type:types[ty],gross:g,rate:rates[Math.floor(rnd()*5)],km:km+dp+dr,dPick:dp,dDel:km,dRet:dr,toll:rnd()>.8?50:0,parking:0,other:0,pickup:a,drop:areas[Math.floor(rnd()*6)],area:a,notes:''});t+=dur+20+Math.floor(rnd()*70)}}
 return{fuel:[[-21,125000,50],[-14,125420,52],[-7,125850,53],[-1,126270,52]].map(([d,odo,l])=>({id:uid(),date:addDays(ymd(new Date()),d),odo,liters:l,price:40.5,total:Math.round(l*40.5*100)/100,station:'PTT Station',ftype:'ดีเซล B7',notes:''})),orders:o,expenses:[{id:uid(),date:ymd(new Date()),cat:'ล้างรถ',amount:80,count:true,notes:''},{id:uid(),date:ymd(new Date()),cat:'อาหาร',amount:60,count:false,notes:''}],
 s:{brand:'Toyota',model:'Hilux Vigo',year:2012,plate:'1กข 1234',fuelType:'ดีเซล B7',kmpl:10,fuelPrice:40,carValue:600000,lifeKm:300000,useDep:true,sticker:'ยังไม่ได้ติด',goalDayP:1000,goalWeekP:6000,goalMonthP:25000,thG:8,thY:4,types:'ประหยัด,ปกติ,เร่งด่วน',rates:'25,17,7',lastRate:25,lastType:'ปกติ'}}}
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D||!D.orders)D=seed();
if(!D.fuel)D.fuel=[];
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
/* ===== Google Drive sync (data lives in your own Drive; local copy = offline cache) ===== */
const GOOGLE_CLIENT_ID='1093198523049-681os78pv61slfdkoaionpqa6eu2h8na.apps.googleusercontent.com';
const FNAME='LalamoveProfit-data.json',SCOPE='https://www.googleapis.com/auth/drive.file';
let TOK=null,tokenClient=null,fileId=null,pend=null,dirty=false,connected=false;
const setSync=t=>{const e=document.getElementById('sync');if(e)e.textContent={off:'📱 ยังไม่เชื่อม Drive · แตะเพื่อเชื่อม',busy:'☁️ กำลังซิงค์…',ok:'☁️ Drive ซิงค์แล้ว',err:'⚠️ ซิงค์ไม่สำเร็จ · แตะลองใหม่'}[t]};
const save=()=>{D.updatedAt=Date.now();saveLocal();push()};
const authUrl=()=>'https://accounts.google.com/o/oauth2/v2/auth?response_type=token&include_granted_scopes=true&client_id='+encodeURIComponent(GOOGLE_CLIENT_ID)+'&redirect_uri='+encodeURIComponent(location.origin+location.pathname)+'&scope='+encodeURIComponent(SCOPE);
(()=>{const m=/access_token=([^&]+).*expires_in=(\d+)/.exec(location.hash);if(m){TOK={t:m[1],exp:Date.now()+(m[2]-60)*1000};try{localStorage.setItem('lm_drive','1')}catch(e){}history.replaceState(null,'',location.pathname)}})();
function getToken(){return new Promise((res,rej)=>{if(TOK&&TOK.exp>Date.now())return res(TOK.t);if(!tokenClient)return rej(new Error('no client'));
 tokenClient.callback=r=>{if(r.error)return rej(new Error(r.error));TOK={t:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};try{localStorage.setItem('lm_drive','1')}catch(e){}res(TOK.t)};
 tokenClient.error_callback=e=>{if(e.type==='popup_failed_to_open'){location.href=authUrl();return}rej(new Error(e.type||'popup'))};tokenClient.requestAccessToken({prompt:''})})}
async function gfetch(url,opt={},retry=true){const t=await getToken();const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});if(r.status===401&&retry){TOK=null;return gfetch(url,opt,false)}if(!r.ok)throw new Error('HTTP '+r.status);return r}
async function findFile(){const q=encodeURIComponent("name='"+FNAME+"' and trashed=false"),j=await(await gfetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&orderBy='+encodeURIComponent('modifiedTime desc')+'&q='+q)).json();return j.files&&j.files[0]?j.files[0].id:null}
async function upload(){const body=JSON.stringify(D);
 if(fileId){await gfetch('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});return}
 const b='lmb'+uid(),meta=JSON.stringify({name:FNAME,mimeType:'application/json'}),mp='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--';
 const j=await(await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp})).json();fileId=j.id}
function push(){if(!connected)return;dirty=true;setSync('busy');clearTimeout(pend);pend=setTimeout(async()=>{try{await upload();setSync('ok')}catch(e){setSync('err')}dirty=false},800)}
async function pull(first){try{setSync('busy');if(!fileId)fileId=await findFile();if(!fileId){await upload();setSync('ok');return}
 const r=await(await gfetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media')).json();if(dirty)return;
 if((r.updatedAt||0)>(D.updatedAt||0)||(first&&!D.updatedAt)){D=r;if(!D.fuel)D.fuel=[];saveLocal();if($sheet.style.display!=='block')render(true)}else if((D.updatedAt||0)>(r.updatedAt||0))await upload();setSync('ok')}catch(e){setSync('err')}}
const loadGIS=()=>new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const e=document.createElement('script');e.src='https://accounts.google.com/gsi/client';e.onload=res;e.onerror=rej;document.head.appendChild(e)});
async function driveConnect(){if(GOOGLE_CLIENT_ID.startsWith('PASTE')){alert('ยังไม่ได้ใส่ Google Client ID ในไฟล์ index.html (ดู README)');return}
 try{setSync('busy');await loadGIS();tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPE,callback:()=>{}});await getToken();connected=true;await pull(true)}catch(e){connected=false;setSync('off')}}
function syncClick(){connected?pull():driveConnect()}
function initDrive(){setSync('off');let was=null;try{was=localStorage.getItem('lm_drive')}catch(e){}if(was&&!GOOGLE_CLIENT_ID.startsWith('PASTE'))driveConnect();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&connected)pull()})}
const S=()=>{const s=D.s;return{...s,fuelPerKm:Calc.fuelPerKm(s.fuelPrice,s.kmpl),depPerKm:Calc.depPerKm(s.carValue,s.lifeKm)}};
const inRange=(a,b)=>[D.orders.filter(o=>o.date>=a&&o.date<=b),D.expenses.filter(o=>o.date>=a&&o.date<=b)];
const rep=(a,b)=>{const[o,e]=inRange(a,b);return Calc.sum(o,e,S())};
/* ===== UI ===== */
const f0=n=>Math.round(n).toLocaleString('th-TH'),f1=n=>(Math.round(n*10)/10).toLocaleString('th-TH');
const cl=n=>n>0?'pos':n<0?'neg':'';
const thDate=(s,o)=>new Date(s+'T12:00').toLocaleDateString('th-TH',o||{day:'numeric',month:'short'});
let tab='home',mode='cash',rp='day',anchor=ymd(new Date()),lst='orders';
const today=()=>ymd(new Date());
function go(t){tab=t;render()}
function render(keep){
 const nav=[['home','🏠','หน้าหลัก'],['orders','📋','งาน'],['add','+',''],['report','📊','รายงาน'],['set','⚙️','ตั้งค่า']];
 $nav.innerHTML=nav.map(([k,i,l])=>k==='add'?`<button class="plus" onclick="openOrder()">+</button>`:`<button class="${tab===k?'on':''}" onclick="go('${k}')">${i}<br>${l}</button>`).join('');
 $app.innerHTML={home,orders,report,set:settings}[tab]();if(!keep)window.scrollTo(0,0)}
function home(){
 const t=today(),r=rep(t,t),s=D.s,v=mode==='cash'?r.cash:r.true,hr=mode==='cash'?r.cashHr:r.trueHr,km=mode==='cash'?r.cashKm:r.trueKm;
 const prog=s.goalDayP?Math.min(100,Math.max(0,r.true/s.goalDayP*100)):0,left=Math.max(0,s.goalDayP-r.true);
 const[os]=inRange(t,t);
 return`<h1>วันนี้ <small style="font-weight:400;color:var(--mut)">${thDate(t,{weekday:'short',day:'numeric',month:'short'})}</small></h1>
 <div class="card hero"><div class="two"><div><small>Cash Profit · เงินเหลือจริง</small><div class="big" style="font-size:34px">${f0(r.cash)}</div><small>${f0(r.cashHr)} ฿/ชม. · ${f1(r.cashKm)} ฿/กม.</small></div><div><small>True Profit · หลังค่าเสื่อม</small><div class="big" style="font-size:34px">${f0(r.true)}</div><small>${f0(r.trueHr)} ฿/ชม. · ${f1(r.trueKm)} ฿/กม.</small></div></div></div>
 <button class="fab" onclick="openOrder()">+ เพิ่มงาน</button>
 <div class="card"><b>เป้ากำไรวันนี้ ${f0(s.goalDayP)} ฿</b><div class="bar"><i style="width:${prog}%"></i></div><small style="color:var(--mut)">ทำได้ ${f0(r.true)} ฿ · ${f0(prog)}% · เหลือ ${f0(left)} ฿</small></div>
 <div class="grid">${[['รายได้ก่อนหัก',r.gross],['Commission',-r.comm],['รายได้หลังหัก',r.net],['ค่าใช้จ่าย',-r.cost],['ค่าเสื่อม',-r.dep],['กำไรสุทธิ',r.true]].map(([a,b])=>`<div class="stat"><span>${a}</span><b class="${a==='กำไรสุทธิ'?cl(b):''}">${f0(b)}</b></div>`).join('')}
 <div class="stat"><span>จำนวน Order</span><b>${r.n}</b></div><div class="stat"><span>ระยะทาง / ชม.ทำงาน</span><b>${f1(r.km)} กม. / ${f1(r.hrs)}</b></div>
 <div class="stat"><span>รายได้ ฿/ชม.</span><b>${f0(r.netHr)}</b></div><div class="stat"><span>รายได้ ฿/กม.</span><b>${f1(r.netKm)}</b></div><div class="stat"><span>Commission เฉลี่ย</span><b>${f1(r.gross?r.comm/r.gross*100:0)}%</b></div><div class="stat"><span>Commission ที่เสียไป</span><b class="neg">${f0(r.comm)} ฿</b></div></div>
 <h2>งานล่าสุดวันนี้</h2><div class="card" style="padding:0">${os.length?os.slice().reverse().map(orderItem).join(''):'<div class="empty">ยังไม่มีงานวันนี้ กด “+ เพิ่มงาน”</div>'}</div>`}

function range(){if(rp==='day')return[anchor,anchor];if(rp==='week')return[addDays(anchor,-6),anchor];const d=new Date(anchor+'T12:00'),a=ymd(new Date(d.getFullYear(),d.getMonth(),1)),b=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));return[a,b]}
function shift(n){if(rp==='month'){const d=new Date(anchor+'T12:00');d.setMonth(d.getMonth()+n);anchor=ymd(d)}else anchor=addDays(anchor,n*(rp==='week'?7:1));render()}

 let prev=null;if(rp==='week')prev=rep(addDays(a,-7),addDays(a,-1));

 const row=(l,v,c)=>`<div class="row ${c||''}"><span class="l">${l}</span><span class="${c==='t'?cl(v):''}">${typeof v==='number'?f0(v):v}</span></div>`;
 const[os]=inRange(a,b),grp=(key,list)=>list.map(k=>{const x=os.filter(o=>String(o[key])===String(k));if(!x.length)return'';const q=Calc.sum(x,[],S());return`<tr><td>${k}${key==='rate'?'%':''}</td><td>${q.n}</td><td>${f0(q.gross)}</td><td>${f0(q.comm)}</td><td>${f0(q.true/q.n)}</td><td>${f1(q.trueKm)}</td></tr>`}).join('');
 const types=D.s.types.split(',').map(x=>x.trim()),rates=[...new Set([...D.s.rates.split(',').map(x=>+x.trim()),...os.map(o=>o.rate)])].sort((x,y)=>y-x);
 const th=h=>`<table><tr><th>${h}</th><th>งาน</th><th>รายได้</th><th>Comm.</th><th>กำไร/งาน</th><th>฿/กม.</th></tr>`;
 return`<h1>รายงาน</h1><div class="seg">${[['day','รายวัน'],['week','7 วัน'],['month','รายเดือน']].map(([k,l])=>`<button class="${rp===k?'on':''}" onclick="rp='${k}';render()">${l}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px"><button class="chip" style="flex:none;width:48px" onclick="shift(-1)">‹</button><b style="text-align:center">${title}</b><button class="chip" style="flex:none;width:48px" onclick="shift(1)">›</button></div>
 <div class="card">${row('รายได้ก่อน Commission',r.gross)}${row('Commission',-r.comm)}${row('Commission เฉลี่ย',f1(r.gross?r.comm/r.gross*100:0)+'%')}${row('รายได้หลัง Commission',r.net)}${row('น้ำมัน',-r.fuel)}${row('ทางด่วน/ค่าจอด/อื่นๆ ใน Order',-r.extra)}${row('ค่าใช้จ่ายอื่น',-r.exp)}${row('Cash Profit',r.cash,'t')}${row('ค่าเสื่อม',-r.dep)}${row('True Profit (กำไรสุทธิ)',r.true,'t')}</div>
 <div class="card">${row('จำนวน Order',r.n)}${row('ระยะทางรวมจริง (กม.)',f1(r.km))}${row('ระยะรถเปล่า ไปรับ+กลับ (กม.)',f1(os.reduce((a,o)=>a+(o.dPick||0)+(o.dRet||0),0)))}${row('ชั่วโมงทำงาน',f1(r.hrs))}${row('กำไร/ชม.',f0(r.trueHr))}${row('กำไร/กม.',f1(r.trueKm))}${row('รายได้/ชม.',f0(r.netHr))}${row('รายได้/กม.',f1(r.netKm))}${rp!=='day'?row('กำไรเฉลี่ย/วัน',f0(r.true/days)):''}</div>
 ${prev?`<div class="card"><b>เทียบสัปดาห์ก่อน</b>${row('กำไร',`${f0(prev.true)} → ${f0(r.true)} (${r.true>=prev.true?'+':''}${f0(r.true-prev.true)})`)}${row('จำนวนงาน',`${prev.n} → ${r.n}`)}</div>`:''}
 <h2>แยกตามประเภทงาน</h2><div class="card">${th('ประเภท')}${grp('type',types)}</table></div>
 <h2>วิเคราะห์ Commission</h2><div class="card">${th('อัตรา')}${grp('rate',rates)}</table><div class="row t" style="margin-top:6px"><span>เสีย Commission ทั้งหมด</span><span class="neg">${f0(r.comm)} ฿</span></div></div>`}

function cur(){return{gross:+$fgross.value||0,rate:+F.rate||0,km:+$fkm.value||0,dPick:+$fdp.value||0,dDel:+$fdd.value||0,dRet:+$fdr.value||0,toll:+$ftoll.value||0,parking:+$fpark.value||0,other:+$foth.value||0,start:$fstart.value,end:$fend.value}}

function upd(){const o=cur(),c=Calc.order(o,S()),h=o.start&&o.end?Calc.hours(o):0,pk=o.km?c.true/o.km:0,v=Calc.verdict(pk,S()),lb={ok:'🟢 คุ้ม',warn:'🟡 พอรับได้',bad:'🔴 ไม่คุ้ม'}[v];
 const r=(l,x,cc)=>`<div class="row ${cc||''}"><span class="l">${l}</span><span>${x}</span></div>`;
 $prev.innerHTML=r('Commission',`-${f0(c.comm)}`)+r('รายได้หลังหัก',f0(c.net))+r('น้ำมัน',`-${f1(c.fuel)}`)+r('ทางด่วน/จอด/อื่นๆ',`-${f0(c.extra)}`)+r('ค่าเสื่อม',`-${f1(c.dep)}`)+(o.dPick||o.dRet?r('รถเปล่า (ไปรับ+กลับ)',f1(o.dPick+o.dRet)+' กม. ('+f0((o.dPick+o.dRet)/(o.km||1)*100)+'%)'):'')+r('กำไรสุทธิ',`<span class="${cl(c.true)}">${f0(c.true)} ฿</span>`,'t')+`<div style="margin-top:6px"><span class="badge b-${v}">${lb}</span> <small style="color:var(--mut)">${f1(pk)} ฿/กม.${h?' · '+f0(c.true/h)+' ฿/ชม.':''}</small></div>`}
function saveOrder(){
 const o=cur(),err=m=>{$err.textContent=m;return};
 const tv=t=>!t||/^([01]\d|2[0-3]):[0-5]\d$/.test(t);if(!tv(o.start)||!tv(o.end))return err('เวลาใช้รูปแบบ 24 ชม. เช่น 08:30 หรือ 18:45');if(rd('fdate')===null)return err('วันที่ไม่ถูกต้อง (วว/ดด/ปปปป)');if(!(o.gross>0))return err('กรอกราคางาน');if(F.rate<0||F.rate>100||isNaN(F.rate))return err('Commission ต้องอยู่ระหว่าง 0–100%');
 if(o.km<=0)return err('กรอกระยะทาง (ต้องมากกว่า 0)');if(o.dPick<0||o.dDel<0||o.dRet<0)return err('ระยะทางห้ามติดลบ');if(o.dPick+o.dDel+o.dRet>0&&Math.abs(o.dPick+o.dDel+o.dRet-o.km)>0.05)return err('ระยะทางรวมไม่ตรงกับ ไปรับ+ส่ง+หลังจบงาน');if(o.start&&o.end&&o.start>o.end)return err('เวลาเริ่มต้องไม่หลังเวลาสิ้นสุด');
 if(o.toll<0||o.parking<0||o.other<0)return err('ค่าใช้จ่ายห้ามติดลบ');
 const rec={...o,id:F.id||uid(),date:rd('fdate'),oid:$foid.value,type:F.type,rate:+F.rate,pickup:$fpick.value,drop:$fdrop.value,area:$farea.value,notes:$fnotes.value};

 D.s.lastRate=rec.rate;D.s.lastType=rec.type;save();closeSheet()}

function fcalc(w){const l=+$gl.value||0,p=+$gp.value||0,t=+$gt.value||0;if(w==='t'){if(l>0)$gp.value=Math.round(t/l*100)/100}else if(p>0&&l>0)$gt.value=Math.round(l*p*100)/100}
function saveFuel(id){const l=+$gl.value,p=+$gp.value,o=+$godo.value,d=rd('gdate'),er=m=>{$err.textContent=m};
 if(d===null)return er('วันที่ไม่ถูกต้อง (วว/ดด/ปปปป)');if(!(l>0))return er('จำนวนลิตรต้องมากกว่า 0');if(!(p>0))return er('ราคาน้ำมันต้องมากกว่า 0');if(!(o>0))return er('กรอกเลขไมล์');
 if(D.fuel.some(x=>x.id!==id&&(x.odo===o||(x.odo<o&&x.date>d)||(x.odo>o&&x.date<d))))return er('เลขไมล์ไม่สอดคล้องกับรายการอื่น (ซ้ำ หรือขัดกับลำดับวันที่)');
 const r={id:id||uid(),date:d,odo:o,liters:l,price:p,total:+$gt.value||Math.round(l*p*100)/100,station:$gst.value,notes:$gn.value,ftype:$gft.value};D.fuel=id?D.fuel.map(x=>x.id===id?r:x):[...D.fuel,r];save();closeSheet()}

function bkCopy(){const t=$bk;t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}}
function bkDl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='lalamove-profit-'+today()+'.json';a.click()}
function bkFile(i){const f=i.files[0];if(f)f.text().then(t=>{$bki.value=t})}
function bkImport(){let j;try{j=JSON.parse($bki.value)}catch(e){$err.textContent='ข้อมูลไม่ถูกต้อง (ไม่ใช่ JSON)';return}
 if(!j||!Array.isArray(j.orders)||!j.s){$err.textContent='ไม่ใช่ไฟล์ข้อมูลของแอปนี้';return}
 if(!confirm('แทนที่ข้อมูลปัจจุบันด้วยข้อมูลที่นำเข้า ('+j.orders.length+' งาน)?'))return;
 D={...j,expenses:j.expenses||[],fuel:j.fuel||[]};save();closeSheet()}
/* ----- Input helpers ----- */
const dmy=s=>s?s.split('-').reverse().join('/'):'';
const dinp=(id,iso)=>`<input id="${id}" type="text" inputmode="numeric" placeholder="วว/ดด/ปปปป" maxlength="10" value="${dmy(iso)}" oninput="dfmt(this)">`;
function dfmt(el){const d=el.value.replace(/\D/g,'').slice(0,8);el.value=[d.slice(0,2),d.slice(2,4),d.slice(4)].filter(Boolean).join('/')}
function rd(id){const v=document.getElementById(id).value.trim();if(!v)return today();const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);if(!m)return null;const[,d,mo,y]=m,t=new Date(+y,mo-1,+d);return t.getFullYear()==y&&t.getMonth()==mo-1&&t.getDate()==+d?y+'-'+mo+'-'+d:null}
function tin(el){const d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length===4?d.slice(0,2)+':'+d.slice(2):d}
function tfix(el){let d=el.value.replace(/\D/g,'');if(!d){el.value='';return upd()}if(d.length<=2)d=d.padStart(2,'0')+'00';else if(d.length===3)d='0'+d;el.value=d.slice(0,2)+':'+d.slice(2,4);upd()}
const FUELS=[['เบนซิน',['เบนซิน 95','แก๊สโซฮอล์ 91','แก๊สโซฮอล์ 95','แก๊สโซฮอล์ E20','แก๊สโซฮอล์ E85']],['ดีเซล',['ดีเซล B7','ดีเซล B20']]];
const fuelOpts=v=>{const all=FUELS.flatMap(g=>g[1]);return(v&&!all.includes(v)?`<option selected>${v}</option>`:'')+FUELS.map(([g,l])=>`<optgroup label="${g}">${l.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</optgroup>`).join('')};
const STATIONS=['PTT Station','Bangchak','PT Station','Shell','Caltex','Susco'];
const stSel=v=>{const l=v&&!STATIONS.includes(v)?[...STATIONS,v]:STATIONS;return `<select id="gst"><option value="">— เลือกปั๊ม —</option>${l.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`};

 return`<h1>ตั้งค่า</h1><div class="card"><div class="row"><span class="l">Google Drive</span><b>${connected?'เชื่อมต่อแล้ว':'ยังไม่เชื่อมต่อ'}</b></div><button class="ghost" onclick="syncClick()">${connected?'ซิงค์เดี๋ยวนี้':'เชื่อมต่อ Google Drive'}</button><button class="ghost" style="margin-top:6px" onclick="location.href=authUrl()">เชื่อมต่อแบบเปลี่ยนหน้า (ถ้าปุ่มปกติไม่ทำงานบน iPhone)</button><small style="color:var(--mut);display:block;margin-top:6px">ข้อมูลเก็บในไฟล์ ${FNAME} ใน My Drive ของคุณ</small></div><h2>รถ</h2><div class="card"><div class="two">${fld('brand','ยี่ห้อ')}${fld('model','รุ่น')}${fld('year','ปี','number')}${fld('plate','ทะเบียน')}<div><label>เชื้อเพลิง</label><select data-k="fuelType">${fuelOpts(s.fuelType)}</select></div>${fld('kmpl','กม./ลิตร','number')}${fld('fuelPrice','ราคาน้ำมัน ฿/ลิตร','number')}${fld('carValue','มูลค่ารถ ฿','number')}${fld('lifeKm','ระยะที่คาดว่าใช้งาน (กม.)','number')}
 <div><label>สถานะสติ๊กเกอร์</label><select data-k="sticker">${['ยังไม่ได้ติด','ติดแล้ว'].map(x=>`<option ${s.sticker===x?'selected':''}>${x}</option>`).join('')}</select></div></div>

 <h2>เป้าหมายกำไร (฿)</h2><div class="card two">${fld('goalDayP','ต่อวัน','number')}${fld('goalWeekP','ต่อสัปดาห์','number')}${fld('goalMonthP','ต่อเดือน','number')}</div>
 <h2>เกณฑ์ “งานนี้คุ้มไหม” (กำไร ฿/กม.)</h2><div class="card two">${fld('thG','🟢 คุ้ม ตั้งแต่','number')}${fld('thY','🟡 พอรับได้ ตั้งแต่','number')}</div>
 <h2>ตัวเลือก (คั่นด้วย ,)</h2><div class="card">${fld('types','ประเภทบริการ')}${fld('rates','Commission %')}</div>
 <button class="fab" onclick="saveSet()">บันทึกการตั้งค่า</button><button class="ghost" style="margin-bottom:8px" onclick="openBackup()">สำรอง / ย้ายข้อมูล (ส่งออก-นำเข้า)</button><button class="ghost danger" style="margin-bottom:8px" onclick="if(confirm('ลบงาน ค่าใช้จ่าย และบันทึกน้ำมันทั้งหมด เพื่อเริ่มใช้ข้อมูลจริง? (การตั้งค่ารถยังอยู่)')){D.orders=[];D.expenses=[];D.fuel=[];save();render()}">ล้างข้อมูลตัวอย่าง / เริ่มข้อมูลจริง</button><button class="ghost" onclick="if(confirm('รีเซ็ตเป็นข้อมูลตัวอย่าง?')){D=seed();save();render()}">รีเซ็ตเป็นข้อมูลตัวอย่าง</button>

function saveSet(){document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;D.s[k]=e.type==='checkbox'?e.checked:e.type==='number'?(+e.value||0):e.value});
